[project]
name = "{{ cookiecutter.project_name }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" },
]
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"

dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.53.0",
{%- if cookiecutter.project_type in ["fastapi_db", "fastapi_db_agent"] %}
    "alembic==1.20.0",
    "fastapi-pagination==0.16.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy[asyncio]==2.0.54",
{%- endif %}
{%- if cookiecutter.project_type in ["fastapi_agent", "fastapi_db_agent"] %}
    "boto3==1.43.101",
    "boto3-stubs[bedrock-runtime]==1.43.101",
    "pydantic-ai-slim[openai,bedrock]==2.49.0",
    "pydantic-extra-types==2.11.1",
{%- endif %}
{%- if cookiecutter.use_otel_observability == "yes" %}
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-semantic-conventions==0.65b0",
    "prometheus-client==0.26.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "prometheus-fastapi-instrumentator==8.1.0",
{%- if cookiecutter.project_type in ["fastapi_db", "fastapi_db_agent"] %}
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
{%- endif %}
{%- endif %}
]

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "ty==0.0.83",
    "prek==0.5.3",
    "complexipy==8.0.1",
    "httpx2==2.13.1",
    "polyfactory==3.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "freezegun==1.5.5",
{%- if cookiecutter.project_type in ["fastapi_db", "fastapi_db_agent"] %}
    "testcontainers[postgres]==4.15.0",
{%- endif %}
]

[tool.uv]
# Guarantee the lock is installable on Docker/CI platforms even when a dependency
# publishes a release with an incomplete wheel set (resolver falls back to an older version).
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.ruff]
line-length = 120
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"
exclude = [
    ".venv",
    #    Include ignore folders if needed
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", # Errors
    "F", # Pyflakes
    "I", # isort
    "S", # flake8-bandit
    "T20", # flake8-print
    "ASYNC", # flake8-async
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "C90", # McCabe complexity
    "DTZ", # flake8-datetimez
    "ARG", # flake8-unused-arguments
    "BLE", # flake8-blind-except
    "ERA", # eradicate - commented Python code
    "ANN", # flake8-annotations
    "FAST", # FastAPI
    "RUF", # Ruff-specific rules
]
pydocstyle.convention = 'google'

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.complexipy]
paths = ["app", "tests"]
max-complexity-allowed = 12
exclude = []

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "ANN"]
"migrations/*" = ["ANN"]

[tool.ruff.lint.isort]
known-local-folder = ["tests", "app", "scripts"]
split-on-trailing-comma = true
combine-as-imports = true
case-sensitive = false
detect-same-package = true
order-by-type = false  # Sorting of all imported objects (functions, classes, etc.) regardless of their type
force-sort-within-sections = true  # Don't sort straight-style imports before from-style imports.
